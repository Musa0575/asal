<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Halaman Utama Editor Soal</title>
  <style>
    #editor {
      width: 100%;
      min-height: 400px;
      border: 1px solid #ccc;
      padding: 15px;
      margin-top: 15px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Editor Soal (index.html)</h2>

  <!-- Area untuk menampilkan atau mengedit soal -->
  <div id="editor" contenteditable="true">
    <i>Belum ada soal yang di-import. Silakan import file .docm terlebih dahulu.</i>
  </div>

  <script>
    // Jalankan kode saat halaman index.html selesai dimuat
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Ambil data soal dari localStorage
      const dataSoal = localStorage.getItem('soalImported');

      if (dataSoal) {
        // 2. Masukkan data soal ke dalam elemen #editor
        document.getElementById('editor').innerHTML = dataSoal;

        // 3. (Opsional) Hapus dari localStorage jika hanya ingin dipakai sekali
        // localStorage.removeItem('soalImported');
      }
    });
  </script>
</body>
</html>
