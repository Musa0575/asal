<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quiz - Sistem Komputer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        tech: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at 20% 20%, #0f172a 0%, #020617 50%, #090d16 100%);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .glow-1 {
            position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            top: -10%; left: -10%; z-index: -1; pointer-events: none;
            animation: floatGlow 10s ease-in-out infinite alternate;
        }

        .glow-2 {
            position: absolute; width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -10%; right: -10%; z-index: -1; pointer-events: none;
            animation: floatGlow 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.70);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-btn {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2) 0%, rgba(30, 41, 59, 0.9) 100%);
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
            transform: translateY(-2px);
        }

        .glass-btn.selected {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.4) 0%, rgba(14, 165, 233, 0.6) 100%) !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5) !important;
        }

        .ladder-badge { transition: all 0.2s ease; border: 1px solid rgba(255, 255, 255, 0.05); }
        .ladder-badge.active {
            background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
            color: #000000; font-weight: 800; box-shadow: 0 0 15px rgba(245, 158, 11, 0.6); border: none;
        }
        .ladder-badge.passed { color: #10b981; background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="h-full flex flex-col justify-between p-3 md:p-5 select-none relative">

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <!-- MODAL INPUT NAMA PLAYER -->
    <div id="player-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-xl flex items-center justify-center p-4 z-50">
        <div class="glass-panel max-w-sm w-full p-6 rounded-2xl text-center border border-sky-500/30">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 mx-auto flex items-center justify-center mb-3 shadow-lg shadow-sky-500/20">
                <i class="fa-solid fa-microchip text-slate-950 text-xl"></i>
            </div>
            <h2 class="font-tech text-xl font-bold text-white tracking-wide mb-1">CYBER QUIZ</h2>
            <p id="total-questions-info" class="text-slate-400 text-xs mb-5">Sistem Komputer</p>

            <form onSubmit="startGameWithPlayer(event)" class="space-y-3">
                <input type="text" id="input-player-name" maxlength="25" placeholder="Nama Lengkap Siswa..." required
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-center text-sky-300 font-tech text-sm focus:outline-none focus:border-sky-400 transition placeholder:text-slate-600">
                
                <input type="text" id="input-player-class" maxlength="15" placeholder="Kelas (Contoh: X RPL 1)..." required
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-center text-sky-300 font-tech text-sm focus:outline-none focus:border-sky-400 transition placeholder:text-slate-600">

                <button type="submit" id="btn-start" class="w-full py-2.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-tech font-bold rounded-xl shadow-lg transition text-xs tracking-wider">
                    MULAI KUIS
                </button>
            </form>
        </div>
    </div>

    <!-- HEADER TOP BAR -->
    <header class="w-full max-w-7xl mx-auto flex justify-between items-center glass-panel px-4 py-2.5 rounded-2xl mb-3">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-sky-500/20 border border-sky-400/40 flex items-center justify-center">
                <i class="fa-solid fa-layer-group text-sky-400 text-sm"></i>
            </div>
            <div>
                <h1 class="font-tech font-bold text-base text-transparent bg-clip-text bg-gradient-to-r from-sky-300 via-purple-200 to-emerald-300">
                    SISTEM KOMPUTER
                </h1>
            </div>
        </div>

        <div class="flex items-center space-x-4 bg-slate-900/80 px-3.5 py-1.5 rounded-xl border border-slate-800 text-xs font-tech">
            <div><span class="text-slate-500">SISWA:</span> <span id="display-player" class="text-sky-400 font-bold">Guest</span></div>
        </div>

        <div class="flex items-center space-x-2">
            <button onClick="restartGameDirect()" class="w-8 h-8 rounded-lg glass-btn text-slate-300 flex items-center justify-center transition" title="Reset Game">
                <i class="fa-solid fa-arrows-rotate text-xs"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-3 flex-1 items-stretch mb-2">
        <section class="lg:col-span-8 flex flex-col justify-between glass-panel p-4 md:p-6 rounded-2xl">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <div class="flex items-baseline gap-1">
                    <span class="text-xs font-tech text-slate-400">SOAL</span>
                    <span id="question-number" class="text-xl font-tech font-bold text-amber-400">1</span>
                    <span id="total-questions-count" class="text-xs font-tech text-slate-500">/25</span>
                </div>

                <div class="flex items-center space-x-2 bg-slate-900/90 px-3 py-1 rounded-full border border-slate-800">
                    <i class="fa-regular fa-clock text-sky-400 text-xs"></i>
                    <span id="timer-text" class="font-tech font-bold text-xs text-sky-300 min-w-[24px]">30s</span>
                    <div class="w-20 bg-slate-800 h-1.5 rounded-full overflow-hidden">
                        <div id="timer-bar" class="bg-gradient-to-r from-sky-400 to-emerald-400 h-full w-full transition-all duration-1000"></div>
                    </div>
                </div>

                <div>
                    <span class="text-xs font-tech text-slate-400">STATUS:</span> 
                    <span id="current-score-text" class="text-sm font-tech font-bold text-emerald-400">0 Benar</span>
                </div>
            </div>

            <!-- TEKS & GAMBAR PERTANYAAN -->
            <div class="my-auto py-3">
    <div class="bg-slate-900/80 border border-slate-800/80 p-4 md:p-5 rounded-2xl shadow-inner min-h-[140px] flex flex-col justify-center gap-3">
        
        <!-- ELEMEN GAMBAR PERTANYAAN -->
        <div class="flex justify-center w-full">
            <img id="question-image" src="" alt="Gambar Soal" class="max-h-48 max-w-full rounded-xl object-contain border border-slate-700/60 shadow-lg hidden">
        </div>
        
        <!-- TEKS PERTANYAAN (Ukuran Dikecilkan, Rata Kiri, & Font Tech Keren) -->
        <h2 id="question-text" class="text-xs md:text-sm lg:text-base font-tech font-medium leading-relaxed text-slate-100 tracking-wide text-left">
            Memuat Pertanyaan...
        </h2>
    </div>
</div>

            <!-- OPSI JAWABAN (A - E) -->
            <!-- OPSI JAWABAN (A - E) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    <!-- OPTION A -->
    <button onClick="selectOption(0)" id="opt-0" class="glass-btn p-3.5 md:p-4 rounded-xl text-left flex items-center justify-between text-xs md:text-sm font-medium group">
        <div class="flex items-center space-x-3">
            <span class="w-6 h-6 rounded-lg bg-sky-500/10 border border-sky-400/30 text-sky-400 font-tech font-bold text-xs flex items-center justify-center shrink-0">A</span>
            <span id="opt-text-0" class="text-slate-200 group-hover:text-white leading-snug">Pilihan A</span>
        </div>
        <!-- LINGKARAN PILIHAN -->
        <div class="opt-circle w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center shrink-0 transition-all duration-200 group-hover:border-sky-400">
            <div class="dot w-2.5 h-2.5 rounded-full bg-transparent transition-all duration-200"></div>
        </div>
    </button>

    <!-- OPTION B -->
    <button onClick="selectOption(1)" id="opt-1" class="glass-btn p-3.5 md:p-4 rounded-xl text-left flex items-center justify-between text-xs md:text-sm font-medium group">
        <div class="flex items-center space-x-3">
            <span class="w-6 h-6 rounded-lg bg-sky-500/10 border border-sky-400/30 text-sky-400 font-tech font-bold text-xs flex items-center justify-center shrink-0">B</span>
            <span id="opt-text-1" class="text-slate-200 group-hover:text-white leading-snug">Pilihan B</span>
        </div>
        <!-- LINGKARAN PILIHAN -->
        <div class="opt-circle w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center shrink-0 transition-all duration-200 group-hover:border-sky-400">
            <div class="dot w-2.5 h-2.5 rounded-full bg-transparent transition-all duration-200"></div>
        </div>
    </button>

    <!-- OPTION C -->
    <button onClick="selectOption(2)" id="opt-2" class="glass-btn p-3.5 md:p-4 rounded-xl text-left flex items-center justify-between text-xs md:text-sm font-medium group">
        <div class="flex items-center space-x-3">
            <span class="w-6 h-6 rounded-lg bg-sky-500/10 border border-sky-400/30 text-sky-400 font-tech font-bold text-xs flex items-center justify-center shrink-0">C</span>
            <span id="opt-text-2" class="text-slate-200 group-hover:text-white leading-snug">Pilihan C</span>
        </div>
        <!-- LINGKARAN PILIHAN -->
        <div class="opt-circle w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center shrink-0 transition-all duration-200 group-hover:border-sky-400">
            <div class="dot w-2.5 h-2.5 rounded-full bg-transparent transition-all duration-200"></div>
        </div>
    </button>

    <!-- OPTION D -->
    <button onClick="selectOption(3)" id="opt-3" class="glass-btn p-3.5 md:p-4 rounded-xl text-left flex items-center justify-between text-xs md:text-sm font-medium group">
        <div class="flex items-center space-x-3">
            <span class="w-6 h-6 rounded-lg bg-sky-500/10 border border-sky-400/30 text-sky-400 font-tech font-bold text-xs flex items-center justify-center shrink-0">D</span>
            <span id="opt-text-3" class="text-slate-200 group-hover:text-white leading-snug">Pilihan D</span>
        </div>
        <!-- LINGKARAN PILIHAN -->
        <div class="opt-circle w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center shrink-0 transition-all duration-200 group-hover:border-sky-400">
            <div class="dot w-2.5 h-2.5 rounded-full bg-transparent transition-all duration-200"></div>
        </div>
    </button>

    <!-- OPTION E -->
    <button onClick="selectOption(4)" id="opt-4" class="glass-btn p-3.5 md:p-4 rounded-xl text-left flex items-center justify-between text-xs md:text-sm font-medium group md:col-span-2">
        <div class="flex items-center space-x-3">
            <span class="w-6 h-6 rounded-lg bg-sky-500/10 border border-sky-400/30 text-sky-400 font-tech font-bold text-xs flex items-center justify-center shrink-0">E</span>
            <span id="opt-text-4" class="text-slate-200 group-hover:text-white leading-snug">Pilihan E</span>
        </div>
        <!-- LINGKARAN PILIHAN -->
        <div class="opt-circle w-5 h-5 rounded-full border-2 border-slate-600 flex items-center justify-center shrink-0 transition-all duration-200 group-hover:border-sky-400">
            <div class="dot w-2.5 h-2.5 rounded-full bg-transparent transition-all duration-200"></div>
        </div>
    </button>
</div>
        </section>

        <!-- SIDEBAR KANAN -->
        <section class="lg:col-span-4 flex flex-col justify-between gap-3">
            <div class="glass-panel p-3.5 rounded-2xl flex-1 flex flex-col justify-between">
                <h3 class="text-center font-tech font-bold text-[11px] tracking-wider text-slate-400 uppercase mb-2">
                    Progres Soal
                </h3>
                <div id="ladder-container" class="grid grid-cols-2 gap-x-2 gap-y-1 flex-1 items-center text-xs overflow-y-auto max-h-[350px]">
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL POPUP HASIL -->
    <div id="game-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-panel max-w-sm w-full p-6 rounded-2xl text-center border border-emerald-500/30">
            <h2 id="modal-title" class="font-tech font-bold text-lg text-emerald-400 mb-1">KUIS SELESAI</h2>
            <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 my-4 font-tech text-xs text-left space-y-1.5">
                <div class="flex justify-between text-slate-400"><span>Nama Siswa:</span> <span id="modal-player" class="text-sky-400 font-bold">Player</span></div>
                <div class="flex justify-between text-slate-400"><span>Kelas:</span> <span id="modal-class" class="text-sky-400 font-bold">Class</span></div>
                <div class="flex justify-between text-slate-400"><span>Total Benar:</span> <span id="modal-correct-count" class="text-emerald-400 font-bold">0</span></div>
                <div class="flex justify-between text-slate-400"><span>Skor Akhir:</span> <span id="modal-final-score" class="text-amber-400 font-bold">0 Poin</span></div>
            </div>
            <button onClick="restartGameDirect()" class="w-full py-2.5 bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-tech font-bold rounded-xl text-xs">
                SELESAI / KERJAKAN ULANG
            </button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJOkm7CG-A9g86aBdREvJZup6ndbj3InrCyKiccNfsc9MfnPOI29AReRMY-qU06lCd/exec";
        
        let rawQuestions = [];
        let questions = [];
        let currentQuestionIdx = 0;
        let timerInterval = null;
        let timeLeft = 30;
        let isAnswered = false;
        let correctAnswersCount = 0;
        let playerName = "Player";
        let playerClass = "-";

        async function fetchQuestions() {
            try {
                const response = await fetch('soal.json');
                if (!response.ok) throw new Error("File soal.json tidak ditemukan!");
                rawQuestions = await response.json();
                
                document.getElementById('total-questions-info').innerText = `Sistem Komputer ${rawQuestions.length} Soal`;
                document.getElementById('total-questions-count').innerText = `/${rawQuestions.length}`;
            } catch (error) {
                console.error(error);
                alert("Gagal memuat soal. Pastikan file 'soal.json' berada di folder yang sama!");
            }
        }

        window.addEventListener('DOMContentLoaded', fetchQuestions);

        function prepareShuffledQuestions() {
            questions = rawQuestions.map(q => {
                const mappedOptions = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.answer }));
                for (let i = mappedOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [mappedOptions[i], mappedOptions[j]] = [mappedOptions[j], mappedOptions[i]];
                }
                const newCorrectIdx = mappedOptions.findIndex(o => o.isCorrect);
                return {
                    q: q.q,
                    image: q.image || "",
                    options: mappedOptions.map(o => o.text),
                    answer: newCorrectIdx
                };
            });
        }

        function startGameWithPlayer(e) {
            e.preventDefault();
            if(rawQuestions.length === 0) {
                alert("Soal belum siap / tidak ditemukan di soal.json!");
                return;
            }
            const valName = document.getElementById('input-player-name').value.trim();
            const valClass = document.getElementById('input-player-class').value.trim();
            
            if (valName) playerName = valName;
            if (valClass) playerClass = valClass;

            document.getElementById('display-player').innerText = `${playerName} (${playerClass})`;
            document.getElementById('player-modal').classList.add('hidden');
            initGame();
        }

        function initGame() {
            prepareShuffledQuestions();
            currentQuestionIdx = 0;
            correctAnswersCount = 0;
            renderLadder();
            loadQuestion();
        }

        function restartGameDirect() {
            document.getElementById('game-modal').classList.add('hidden');
            document.getElementById('player-modal').classList.remove('hidden');
        }

        function renderLadder() {
            const container = document.getElementById('ladder-container');
            container.innerHTML = '';
            for(let i = 0; i < questions.length; i++) {
                const item = document.createElement('div');
                let statusClass = "ladder-badge text-[10px] p-1.5 rounded-lg flex justify-between bg-slate-900/60 text-slate-400";
                
                if (i === currentQuestionIdx) statusClass = "ladder-badge active text-[10px] p-1.5 rounded-lg flex justify-between";
                else if (i < currentQuestionIdx) statusClass = "ladder-badge passed text-[10px] p-1.5 rounded-lg flex justify-between";

                item.className = statusClass;
                item.innerHTML = `<span>Soal ${i+1}</span>`;
                container.appendChild(item);
            }
        }

        function loadQuestion() {
            if (currentQuestionIdx >= questions.length) {
                endGame();
                return;
            }

            isAnswered = false;
            renderLadder();
            
            const qData = questions[currentQuestionIdx];
            document.getElementById('question-number').innerText = currentQuestionIdx + 1;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('current-score-text').innerText = `${correctAnswersCount} Benar`;

            // TAMPILKAN ATAU SEMBUNYIKAN GAMBAR
            const imgElement = document.getElementById('question-image');
            if (qData.image && qData.image.trim() !== "") {
                imgElement.src = qData.image;
                imgElement.classList.remove('hidden');
            } else {
                imgElement.src = "";
                imgElement.classList.add('hidden');
            }

            // SETTING OPSI JAWABAN (Dinamis A - E)
            const optionCount = qData.options.length;
            for (let i = 0; i < 5; i++) {
                const btn = document.getElementById(`opt-${i}`);
                const textSpan = document.getElementById(`opt-text-${i}`);

                if (i < optionCount) {
                    btn.classList.remove('hidden');
                    btn.className = `glass-btn p-3.5 md:p-4 rounded-xl text-left flex items-center space-x-3 text-xs md:text-sm font-medium group ${i === 4 ? 'md:col-span-2' : ''}`;
                    btn.disabled = false;
                    textSpan.innerText = qData.options[i];
                } else {
                    btn.classList.add('hidden');
                }
            }

            resetTimer();
            startTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('timer-text').innerText = "30s";
            document.getElementById('timer-bar').style.width = "100%";
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-text').innerText = `${timeLeft}s`;
                document.getElementById('timer-bar').style.width = `${(timeLeft / 30) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    processAnswer(-1);
                }
            }, 1000);
        }

        function selectOption(idx) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);

            const btn = document.getElementById(`opt-${idx}`);
            btn.classList.add('selected');

            setTimeout(() => {
                processAnswer(idx);
            }, 600);
        }

        function processAnswer(selectedIdx) {
            const currentQ = questions[currentQuestionIdx];
            const isCorrect = (selectedIdx === currentQ.answer);

            if (isCorrect) correctAnswersCount++;

            currentQuestionIdx++;
            loadQuestion();
        }

        function endGame() {
            clearInterval(timerInterval);
            const totalScore = Math.round((correctAnswersCount / questions.length) * 100);

            document.getElementById('modal-player').innerText = playerName;
            document.getElementById('modal-class').innerText = playerClass;
            document.getElementById('modal-correct-count').innerText = `${correctAnswersCount} / ${questions.length}`;
            document.getElementById('modal-final-score').innerText = `${totalScore} Poin`;
            document.getElementById('game-modal').classList.remove('hidden');

            if (totalScore >= 70) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            // Kirim Nilai ke Google Sheets
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama: playerName, kelas: playerClass, skor: totalScore })
            });
        }
    </script>
</body>
</html>
