<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulator Code HTML/CSS/JS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #1e1e1e;
      color: #fff;
    }
    header {
      padding: 10px 20px;
      background-color: #252526;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    h1 {
      font-size: 1.1rem;
      color: #007acc;
    }
    button {
      background-color: #0e639c;
      color: white;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1177bb;
    }
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .editor-section {
      width: 50%;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #333;
    }
    .preview-section {
      width: 50%;
      background-color: #fff;
      display: flex;
      flex-direction: column;
    }
    .tab-header {
      display: flex;
      background-color: #2d2d2d;
    }
    .tab-btn {
      padding: 10px 15px;
      background-color: transparent;
      color: #888;
      border: none;
      border-radius: 0;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab-btn.active {
      background-color: #1e1e1e;
      color: #fff;
      border-top: 2px solid #007acc;
    }
    .editor-wrapper {
      flex: 1;
      position: relative;
    }
    textarea {
      width: 100%;
      height: 100%;
      background-color: #1e1e1e;
      color: #d4d4d4;
      border: none;
      padding: 15px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      resize: none;
      outline: none;
      display: none;
      line-height: 1.5;
    }
    textarea.active {
      display: block;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>Simulator HTML/CSS/JS</h1>
    <button onclick="runCode()">Jalankan Kode</button>
  </header>

  <div class="container">
    <!-- Panel Editor -->
    <div class="editor-section">
      <div class="tab-header">
        <button class="tab-btn active" onclick="openTab('html')">HTML</button>
        <button class="tab-btn" onclick="openTab('css')">CSS</button>
        <button class="tab-btn" onclick="openTab('js')">JavaScript</button>
      </div>
      <div class="editor-wrapper">
        <textarea id="html-code" class="active" placeholder="Tulis kode HTML di sini..."></textarea>
        <textarea id="css-code" placeholder="Tulis kode CSS di sini..."></textarea>
        <textarea id="js-code" placeholder="Tulis kode JavaScript di sini..."></textarea>
      </div>
    </div>

    <!-- Panel Hasil/Preview -->
    <div class="preview-section">
      <iframe id="preview"></iframe>
    </div>
  </div>

  <script>
    // Contoh Kode Default
    document.getElementById('html-code').value = `<h1>Halo Dunia!</h1>\n<p>Klik tombol di bawah untuk mencoba JavaScript:</p>\n<button id="btn">Klik Saya</button>`;
    
    document.getElementById('css-code').value = `body {\n  font-family: Arial, sans-serif;\n  padding: 20px;\n  text-align: center;\n}\nh1 {\n  color: #007acc;\n}\nbutton {\n  padding: 10px 20px;\n  background-color: #28a745;\n  color: white;\n  border: none;\n  border-radius: 5px;\n  cursor: pointer;\n}`;
    
    document.getElementById('js-code').value = `document.getElementById('btn').addEventListener('click', function() {\n  alert('JavaScript berhasil dijalankan!');\n});`;

    // Fungsi untuk berpindah tab editor
    function openTab(tabName) {
      const textareas = document.querySelectorAll('.editor-wrapper textarea');
      const tabs = document.querySelectorAll('.tab-btn');

      textareas.forEach(ta => ta.classList.remove('active'));
      tabs.forEach(tab => tab.classList.remove('active'));

      document.getElementById(tabName + '-code').classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Fungsi untuk menjalankan kode di iframe
    function runCode() {
      const html = document.getElementById('html-code').value;
      const css = document.getElementById('css-code').value;
      const js = document.getElementById('js-code').value;
      const preview = document.getElementById('preview').contentWindow.document;

      preview.open();
      preview.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <style>${css}</style>
        </head>
        <body>
          ${html}
          <script>${js}<\/script>
        </body>
        </html>
      `);
      preview.close();
    }

    // Jalankan kode otomatis saat pertama kali dibuka
    runCode();
  </script>

</body>
</html>
