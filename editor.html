<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Soal Kuis (Dengan Gambar)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">Editor Soal Kuis</h1>
                <p class="text-xs text-slate-400">Buat, tambah gambar, dan unduh file soal.json</p>
            </div>
            <button onClick="downloadJSON()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-2 shadow-lg transition">
                <i class="fa-solid fa-download"></i> Unduh soal.json
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- FORM INPUT SOAL -->
            <div class="lg:col-span-7 bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2">Tambah / Edit Soal</h2>

                <!-- Input Pertanyaan -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Pertanyaan / Soal:</label>
                    <textarea id="input-q" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-sky-400 text-slate-100" placeholder="Tuliskan pertanyaan di sini..."></textarea>
                </div>

                <!-- INPUT GAMBAR (FILE & URL) -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 space-y-3">
                    <label class="block text-xs font-semibold text-sky-400">
                        <i class="fa-solid fa-image"></i> Gambar Soal (Opsional)
                    </label>
                    
                    <!-- Opsi A: Upload File -->
                    <div>
                        <span class="text-[11px] text-slate-400 block mb-1">Pilihan 1: Upload File Gambar dari Komputer</span>
                        <input type="file" id="input-img-file" accept="image/*" onChange="handleFileUpload(event)" class="text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-500 cursor-pointer">
                    </div>

                    <div class="text-center text-xs text-slate-500 font-bold">- ATAU -</div>

                    <!-- Opsi B: Link URL -->
                    <div>
                        <span class="text-[11px] text-slate-400 block mb-1">Pilihan 2: Link URL Gambar</span>
                        <input type="text" id="input-img-url" oninput="handleUrlInput()" placeholder="https://example.com/gambar.jpg" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs focus:outline-none focus:border-sky-400 text-slate-200">
                    </div>

                    <!-- Preview Gambar Saat Ini -->
                    <div id="preview-box" class="hidden text-center pt-2">
                        <span class="text-[10px] text-slate-400 block mb-1">Preview Gambar:</span>
                        <img id="img-preview" src="" class="max-h-36 mx-auto rounded-lg border border-slate-600 shadow-md object-contain">
                        <button onClick="clearImage()" class="mt-2 text-[10px] text-red-400 hover:underline">Hapus Gambar</button>
                    </div>
                </div>

                <!-- Input Opsi A - E -->
                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-slate-300">Pilihan Jawaban (Tandai Jawaban Benar):</label>

                    <div class="flex items-center gap-2">
                        <input type="radio" name="correct-opt" value="0" checked class="accent-emerald-500">
                        <span class="text-xs font-bold w-4">A.</span>
                        <input type="text" id="opt-0" placeholder="Jawaban A" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="radio" name="correct-opt" value="1" class="accent-emerald-500">
                        <span class="text-xs font-bold w-4">B.</span>
                        <input type="text" id="opt-1" placeholder="Jawaban B" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="radio" name="correct-opt" value="2" class="accent-emerald-500">
                        <span class="text-xs font-bold w-4">C.</span>
                        <input type="text" id="opt-2" placeholder="Jawaban C" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="radio" name="correct-opt" value="3" class="accent-emerald-500">
                        <span class="text-xs font-bold w-4">D.</span>
                        <input type="text" id="opt-3" placeholder="Jawaban D" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="radio" name="correct-opt" value="4" class="accent-emerald-500">
                        <span class="text-xs font-bold w-4">E.</span>
                        <input type="text" id="opt-4" placeholder="Jawaban E (Opsional)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
                    </div>
                </div>

                <button onClick="addQuestion()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
                    + Tambahkan Soal ke Daftar
                </button>
            </div>

            <!-- DAFTAR SOAL YANG TERBUAT -->
            <div class="lg:col-span-5 bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2 mb-3">
                        Daftar Soal (<span id="count-soal">0</span>)
                    </h2>
                    <div id="soal-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                        <p class="text-xs text-slate-500 text-center py-8">Belum ada soal yang ditambahkan.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let questionsData = [];
        let currentImageData = ""; // Menyimpan string gambar (Base64 atau URL)

        // 1. Membaca Upload File Gambar dari Komputer (Convert ke Base64)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageData = e.target.result; // Data Base64 Gambar
                    showPreview(currentImageData);
                    document.getElementById('input-img-url').value = ""; // Clear input URL
                };
                reader.readAsDataURL(file);
            }
        }

        // 2. Membaca Input Link URL Gambar
        function handleUrlInput() {
            const url = document.getElementById('input-img-url').value.trim();
            if (url !== "") {
                currentImageData = url;
                showPreview(currentImageData);
                document.getElementById('input-img-file').value = ""; // Clear input File
            } else {
                clearImage();
            }
        }

        // Tampilkan Preview Gambar
        function showPreview(src) {
            const previewBox = document.getElementById('preview-box');
            const imgPreview = document.getElementById('img-preview');
            imgPreview.src = src;
            previewBox.classList.remove('hidden');
        }

        // Hapus Gambar
        function clearImage() {
            currentImageData = "";
            document.getElementById('input-img-file').value = "";
            document.getElementById('input-img-url').value = "";
            document.getElementById('img-preview').src = "";
            document.getElementById('preview-box').classList.add('hidden');
        }

        // Tambahkan Soal ke Array JavaScript
        function addQuestion() {
            const qText = document.getElementById('input-q').value.trim();
            if (!qText) {
                alert("Pertanyaan tidak boleh kosong!");
                return;
            }

            // Ambil Opsi Jawaban
            const options = [];
            for (let i = 0; i < 5; i++) {
                const val = document.getElementById(`opt-${i}`).value.trim();
                if (val !== "") options.push(val);
            }

            if (options.length < 2) {
                alert("Minimal isi 2 opsi jawaban!");
                return;
            }

            const answerIdx = parseInt(document.querySelector('input[name="correct-opt"]:checked').value);

            // Objek Soal Baru
            const newQuestion = {
                q: qText,
                image: currentImageData, // Gambar berupa URL atau Base64
                options: options,
                answer: answerIdx
            };

            questionsData.push(newQuestion);
            renderSoalList();
            resetForm();
        }

        // Reset Form setelah tambah soal
        function resetForm() {
            document.getElementById('input-q').value = "";
            for (let i = 0; i < 5; i++) {
                document.getElementById(`opt-${i}`).value = "";
            }
            clearImage();
        }

        // Tampilkan Daftar Soal di Kolom Kanan Editor
        function renderSoalList() {
            const container = document.getElementById('soal-list');
            document.getElementById('count-soal').innerText = questionsData.length;

            if (questionsData.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Belum ada soal yang ditambahkan.</p>`;
                return;
            }

            container.innerHTML = "";
            questionsData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs space-y-2 relative group";
                
                let imgTag = item.image ? `<img src="${item.image}" class="h-16 rounded border border-slate-700 object-contain my-1">` : '';

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-sky-400">Soal #${idx + 1}</span>
                        <button onclick="deleteQuestion(${idx})" class="text-red-400 hover:text-red-300">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <p class="text-slate-200 font-medium">${item.q}</p>
                    ${imgTag}
                    <div class="text-[11px] text-slate-400">
                        Jawaban Benar: <span class="text-emerald-400 font-bold">${String.fromCharCode(65 + item.answer)} (${item.options[item.answer]})</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteQuestion(index) {
            questionsData.splice(index, 1);
            renderSoalList();
        }

        // Unduh File soal.json
        function downloadJSON() {
            if (questionsData.length === 0) {
                alert("Belum ada soal untuk diunduh!");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questionsData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "soal.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
